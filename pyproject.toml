[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isrc-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented recording-code claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
isrc-validation-claim-audit = "isrc_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["isrc_validation_claim_audit*"]
